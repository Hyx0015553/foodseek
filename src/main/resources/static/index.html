    <style id="layuimini-bg-color">

        /* 全局 AI 小助手悬浮入口：位置上移、加大，带轻微呼吸动效便于发现 */
        @keyframes aiFabGlow {
            0%, 100% {
                box-shadow: 0 10px 32px rgba(255, 90, 0, 0.48), 0 0 0 0 rgba(255, 140, 60, 0.4);
            }
            50% {
                box-shadow: 0 14px 44px rgba(255, 77, 0, 0.58), 0 0 0 10px rgba(255, 140, 60, 0.14);
            }
        }
        /* 悬浮钮：贴视口右下角，避免视觉上落在内容区中部；尺寸加大便于发现 */
        #aiFabWrap {
            position: fixed;

            bottom: 118px;
            z-index: 2147483646;
            border-radius: 999px;
            pointer-events: auto;
            display: block;
            visibility: visible;

        @media (max-width: 1280px) {
            #aiFabWrap {
                right: 20px;

        #aiFabBtn {

            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
            animation: aiFabGlow 2.6s ease-in-out infinite;
            transition: transform 0.18s ease, filter 0.18s ease;
        }
        #aiFabBtn .ai-fab-ico {

        #aiFabBtn:hover {

        @media (max-height: 520px) {

<div id="aiFabWrap" class="admin-ai-fab-wrap" title="打开 AI 小助手（悬浮入口）"
     style="position:fixed;right:24px;bottom:118px;z-index:2147483646;display:block;visibility:visible;">
    <button type="button" id="aiFabBtn" class="layui-btn layui-btn-danger layui-btn-radius">
        <i class="fa fa-comments ai-fab-ico" aria-hidden="true"></i>
        <span>AI小助手</span>
    </button>

<script src="./__PUBLIC__/layuimini/lib/layui-v2.5.5/layui.js" charset="utf-8"></script>
<script src="./__PUBLIC__/layuimini/js/lay-config.js?v=2.0.0" charset="utf-8"></script>
<script>
    if(userinfo){
        $("#usernameshow").text(userinfo.username);
    }else{
        window.location = 'login.html';
    }

    var _layer;
    var managedialogindex;
    function openChangeDialog(){
        $("#changepasswdform")[0].reset();
        managedialogindex = _layer.open({
            title: '编辑数据',
            type: 1,
            shade: 0.2,
            maxmin: true,
            shadeClose: true,
            area: ['90%', '90%'],
            content: $('#changepasswdform'),
            end: function(){
                managedialogindex = undefined;
            }
        });
    }
    layui.use(['layer', 'element', 'miniAdmin','miniTongji','form'], function () {

        var layer = layui.layer,
            element = layui.element,
            miniAdmin = layui.miniAdmin,
            form = layui.form,
            miniTongji = layui.miniTongji;

        _layer = layer;

        var iniUrl = null;
        var roletype = userinfo.roletype != null && userinfo.roletype !== ''
            ? String(userinfo.roletype)
            : (userinfo.role != null ? String(userinfo.role) : '');
        if(roletype=="1"){
            // 超级管理员
            iniUrl = "./__PUBLIC__/layuimini/api/init.json";
        }else if(roletype=="5"){
            // 运营管理员
            iniUrl = "./__PUBLIC__/layuimini/api/init5.json";
        }else if(roletype=="6"){
            // 审核管理员
            iniUrl = "./__PUBLIC__/layuimini/api/init6.json";
        }else if(roletype=="3"){
            // 商家
            iniUrl = "./__PUBLIC__/layuimini/api/init3.json";
        }
        var options = {
            iniUrl: iniUrl,    // 初始化接口
            clearUrl: "./__PUBLIC__/layuimini/api/clear.json", // 缓存清理接口
            urlHashLocation: true,      // 是否打开hash定位
            bgColorDefault: false,      // 主题默认配置
            multiModule: true,          // 是否开启多模块
            menuChildOpen: false,       // 是否默认展开菜单
            loadingTime: 0,             // 初始化加载时间
            pageAnim: true,             // iframe窗口动画
            maxTabNum: 10              // 最大的tab打开数量
        };
        miniAdmin.render(options);

        /** 保证悬浮钮挂在 body 末尾并强制可见（避免被主题层叠或异常 CSS 盖住） */
        (function ensureAiFabMounted() {
            var wrap = document.getElementById('aiFabWrap');
            if (!wrap) {
                return;
            }
            try {
                document.body.appendChild(wrap);
            } catch (e0) {
            }
            wrap.style.setProperty('position', 'fixed', 'important');
            wrap.style.setProperty('right', '24px', 'important');
            wrap.style.setProperty('bottom', '118px', 'important');
            wrap.style.setProperty('z-index', '2147483646', 'important');
            wrap.style.setProperty('display', 'block', 'important');
            wrap.style.setProperty('visibility', 'visible', 'important');
            wrap.style.setProperty('opacity', '1', 'important');
            wrap.style.setProperty('pointer-events', 'auto', 'important');
        })();

        window._aiFabLayerIndex = null;
        /** 读取当前 Layui Tab，供 AI 助手带入页面上下文（标题 + 页面 href） */
        function getCurrentAdminTabContext() {
            var $li = $('.layui-tab-title li.layui-this');
            if (!$li.length) {
                return { tabTitle: '', tabHref: '' };
            }
            var href = ($li.attr('lay-id') || '').trim();
            var $titleSpan = $li.children('span').not('.layuimini-tab-active');
            var tabTitle = '';
            if ($titleSpan.length) {
                tabTitle = $titleSpan.first().text().replace(/\s+/g, ' ').trim();
            }
            return { tabTitle: tabTitle, tabHref: href };
        }
        /** AI 助手弹层 iframe 同步当前 Tab（切换标签页时调用） */
        function postAiAssistantCtx(layerIdx) {
            var idx = layerIdx != null ? layerIdx : window._aiFabLayerIndex;
            if (idx == null || idx === '') {
                return;
            }
            var ctx = getCurrentAdminTabContext();
            /* 勿向 iframe 推空上下文：会冲掉助手页 URL 里自带的 tabTitle/tabHref，导致芯片退化成三条通用句 */
            if (!ctx.tabTitle && !ctx.tabHref) {
                return;
            }
            try {
                var $ifr = $('#layui-layer-' + idx).find('iframe');
                if ($ifr.length && $ifr[0].contentWindow) {
                    $ifr[0].contentWindow.postMessage({
                        type: 'adminAiCtx',
                        tabTitle: ctx.tabTitle,
                        tabHref: ctx.tabHref
                    }, '*');
                }
            } catch (e0) {
            }
            try {
                var titleText = 'AI小助手';
                if (ctx.tabTitle) {
                    titleText += ctx.tabTitle.length <= 14 ? (' · ' + ctx.tabTitle) : (' · ' + ctx.tabTitle.slice(0, 14) + '…');
                }
                $('#layui-layer-' + idx + ' .layui-layer-title').text(titleText);
            } catch (e1) {
            }
        }
        element.on('tab(layuiminiTab)', function () {
            postAiAssistantCtx();
        });
        function openAiAssistantFloat() {
            if (window._aiFabLayerIndex != null) {
                try {
                    layer.close(window._aiFabLayerIndex);
                } catch (e0) {
                }
                window._aiFabLayerIndex = null;
            }
            var ctx = getCurrentAdminTabContext();
            var qs = [];
            if (ctx.tabTitle) {
                qs.push('tabTitle=' + encodeURIComponent(ctx.tabTitle));
            }
            if (ctx.tabHref) {
                qs.push('tabHref=' + encodeURIComponent(ctx.tabHref));
            }
            var url = 'ai-assistant.html' + (qs.length ? '?' + qs.join('&') : '');
            var winTitle = 'AI小助手';
            if (ctx.tabTitle && ctx.tabTitle.length <= 14) {
                winTitle = 'AI小助手 · ' + ctx.tabTitle;
            } else if (ctx.tabTitle) {
                winTitle = 'AI小助手 · ' + ctx.tabTitle.slice(0, 14) + '…';
            }
            window._aiFabLayerIndex = layer.open({
                type: 2,
                title: winTitle,
                shade: 0.35,
                area: ['92%', '86%'],
                maxmin: true,
                content: url,
                success: function (layero, index) {
                    setTimeout(function () {
                        postAiAssistantCtx(index);
                    }, 480);
                },
                end: function () {
                    window._aiFabLayerIndex = null;
                }
            });
        }
        $(document).on('click', '#aiFabBtn', function () {
            openAiAssistantFloat();
        });

        $(window).on("resize", function () {
            if (managedialogindex == null || managedialogindex === '') {
                return;
            }
            try {
                layer.full(managedialogindex);
            } catch (e) {
                /* 弹层已关闭或索引失效时 layer.full 会报错，避免影响 iframe 内其它 layer */
            }
        });

        $('.login-out').on("click", function () {
            layer.msg('退出登录成功',{time:1000}, function () {
                localStorage['adminuserinfo'] = null;
                window.location = 'login.html';
            });
        });

        $('#quickLogout').on("click", function () {
            layer.confirm('确认清除登录信息并退出？', {icon: 3, title:'提示'}, function(index){
                localStorage['adminuserinfo'] = null;
                layer.close(index);
                window.location = 'login.html';
            });
        });

        form.on('submit(saveBtn)',function (formobj){
            var fdata = formobj.field;
            fdata.id = userinfo.id;
            if(fdata.oldpasswd!=userinfo.passwd){
                layer.msg('原始密码错误!',{time:1000}, function () {

                });

            }else if(fdata.passwd!==fdata.passwd2){
                layer.msg('两次密码不一致!',{time:1000}, function () {

                });

            }else{
                fdata.table="user";
                ajaxCallback1("save",fdata,function (data) {
                    layer.msg('密码修改成功!',{time:1000}, function () {
                        window.location = 'login.html';
                    });
                })
            }

            return false;
        });
    });
</script>
