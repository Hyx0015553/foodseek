<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./__PUBLIC__/layui-vue/layuivue.css" />
    <link rel="stylesheet" href="./__PUBLIC__/layui-vue/public.css" />
    <script src="./__PUBLIC__/layui-vue/vue.global.js"></script>
    <script src="./__PUBLIC__/layui-vue/layui-vue.js"></script>
    <script type="text/javascript" src="./__PUBLIC__/js/jquery-3.4.1.min.js"></script>
    <script type="text/javascript" src="./__PUBLIC__/js/common.js"></script>
</head>
<body>
<div id="app">
    <lay-container>
        <lay-field title="敏感词管理">
            <lay-form :model="sobj">
                <lay-row>
                    <lay-col :md="6">
                        <lay-form-item label="词条" :label-width="0">
                            <lay-input v-model="sobj.title" style="width: 100%"></lay-input>
                        </lay-form-item>
                    </lay-col>
                    <lay-col :md="8">
                        <lay-form-item label-width="0">
                            <lay-button type="normal" style="margin-left: 10px" @click="refreshWords" prefix-icon="layui-icon-search">查询</lay-button>
                            <lay-button type="danger" @click="resetWordQuery" prefix-icon="layui-icon-refresh-three">重置</lay-button>
                        </lay-form-item>
                    </lay-col>
                </lay-row>
            </lay-form>
            <lay-table
                    :page="page"
                    :resize="true"
                    :height="280"
                    :columns="wordColumns"
                    :loading="loadingWords"
                    :default-toolbar="true"
                    :data-source="wordList"
                    @change="refreshWords"
                    @sortChange="sortChange"
                    :even="true">
                <template v-slot:toolbar>
                    <lay-button size="sm" type="normal" @click="showEdit()">新增</lay-button>
                </template>
                <template v-slot:operator="{ row }">
                    <lay-button size="xs" @click="showEdit(row)" type="normal">编辑</lay-button>
                    <lay-button size="xs" @click="delWord(row.id)" type="danger">删除</lay-button>
                </template>
            </lay-table>
        </lay-field>

        <lay-field title="AI候选词管理">
            <lay-form :model="qobj">
                <lay-row>
                    <lay-col :md="4">
                        <lay-form-item label="状态" :label-width="56">
                            <lay-select v-model="qobj.statecn" style="width: 100%">
                                <lay-select-option value="">全部</lay-select-option>
                                <lay-select-option value="待处理">待处理</lay-select-option>
                                <lay-select-option value="已采纳">已采纳</lay-select-option>
                                <lay-select-option value="已忽略">已忽略</lay-select-option>
                            </lay-select>
                        </lay-form-item>
                    </lay-col>
                    <lay-col :md="6">
                        <lay-form-item label="业务表" :label-width="56">
                            <lay-input v-model="qobj.tablename"></lay-input>
                        </lay-form-item>
                    </lay-col>
                    <lay-col :md="8">
                        <lay-form-item :label-width="0">
                            <lay-button type="normal" @click="refreshCandidates" prefix-icon="layui-icon-search">查询</lay-button>
                            <lay-button type="danger" @click="resetCandidateQuery" prefix-icon="layui-icon-refresh-three">重置</lay-button>
                        </lay-form-item>
                    </lay-col>
                </lay-row>
            </lay-form>

            <lay-table
                    :columns="candidateColumns"
                    :data-source="candidateList"
                    :loading="loadingCandidates"
                    :resize="true"
                    :height="300"
                    :default-toolbar="true"
                    :even="true">
                <template v-slot:operator="{ row }">
                    <lay-button size="xs" type="normal" @click="openAdopt(row)" :disabled="row.statecn!=='待处理'">采纳</lay-button>
                    <lay-button size="xs" type="danger" @click="ignoreCandidate(row)" :disabled="row.statecn!=='待处理'">忽略</lay-button>
                </template>
            </lay-table>
        </lay-field>

        <lay-field title="敏感拦截日志">
            <lay-table
                    :columns="logColumns"
                    :data-source="logList"
                    :loading="loadingLogs"
                    :resize="true"
                    :height="280"
                    :default-toolbar="true"
                    :even="true">
            </lay-table>
        </lay-field>

        <div class="formdialog" v-show="showWordEdit">
            <div class="formdialogtitle">编辑敏感词<span class="formdialogtitlegb" @click="showWordEdit=false"></span></div>
            <lay-form ref="wordFormRef" required :pane="true" :model="fobj">
                <lay-form-item label="词条" prop="title">
                    <lay-input type="text" v-model="fobj.title"></lay-input>
                </lay-form-item>
                <lay-form-item style="text-align: center;margin-top: 50px;">
                    <lay-button type="normal" @click="submitWord">提交</lay-button>
                    <lay-button type="default" @click="showWordEdit=false">取消</lay-button>
                </lay-form-item>
            </lay-form>
        </div>

        <div class="formdialog" v-show="showAdopt">
            <div class="formdialogtitle">采纳候选词<span class="formdialogtitlegb" @click="showAdopt=false"></span></div>
            <lay-form :pane="true" :model="adoptForm">
                <lay-form-item label="候选ID">
                    <lay-input type="text" v-model="adoptForm.id" :disabled="true"></lay-input>
                </lay-form-item>
                <lay-form-item label="敏感词">
                    <lay-input type="text" v-model="adoptForm.word" placeholder="可修改为更准确的词条"></lay-input>
                </lay-form-item>
                <lay-form-item style="text-align: center;margin-top: 40px;">
                    <lay-button type="normal" @click="adoptCandidate">确认采纳</lay-button>
                    <lay-button @click="showAdopt=false">取消</lay-button>
                </lay-form-item>
            </lay-form>
        </div>
    </lay-container>
</div>
<script>
    const App = {
        data() {
            return {
                tbname: "mgc",
                page: { current: 1, limit: 10, total: 100 },
                sobj: {},
                fobj: {},
                showWordEdit: false,
                loadingWords: false,
                wordList: [],
                wordColumns: [
                    { title: "编号", key: "id", ellipsisTooltip: true, sort: "desc", width: "90px" },
                    { title: "词条", key: "title", ellipsisTooltip: true },
                    { title: "操作", width: "180px", customSlot: "operator", key: "operator", fixed: "right" }
                ],
                qobj: { statecn: "待处理", tablename: "" },
                loadingCandidates: false,
                candidateList: [],
                candidateColumns: [
                    { title: "ID", key: "id", width: "70px" },
                    { title: "业务表", key: "tablename", width: "120px" },
                    { title: "字段", key: "fieldnames", width: "160px" },
                    { title: "原因", key: "reason", width: "160px", ellipsisTooltip: true },
                    { title: "内容片段", key: "content", ellipsisTooltip: true },
                    { title: "状态", key: "statecn", width: "90px" },
                    { title: "时间", key: "ndate", width: "170px" },
                    { title: "操作", customSlot: "operator", width: "140px", fixed: "right" }
                ],
                loadingLogs: false,
                logList: [],
                logColumns: [
                    { title: "ID", key: "id", width: "70px" },
                    { title: "业务表", key: "tablename", width: "110px" },
                    { title: "字段", key: "fieldnames", width: "150px" },
                    { title: "方式", key: "checkmode", width: "80px" },
                    { title: "命中词", key: "hitwords", width: "150px", ellipsisTooltip: true },
                    { title: "原因", key: "reason", width: "150px", ellipsisTooltip: true },
                    { title: "内容片段", key: "content", ellipsisTooltip: true },
                    { title: "时间", key: "ndate", width: "170px" }
                ],
                showAdopt: false,
                adoptForm: { id: "", word: "" }
            };
        },
        mounted() {
            this.refreshWords();
            this.refreshCandidates();
            this.refreshLogs();
        },
        methods: {
            resetWordQuery() {
                this.sobj = {};
                this.refreshWords();
            },
            refreshWords() {
                let s = this.sobj || {};
                s.table = this.tbname;
                s.page = this.page.current;
                s.limit = this.page.limit;
                this.loadingWords = true;
                ajaxCallback1("listPage", s, (r) => {
                    this.loadingWords = false;
                    this.wordList = (r && r.rows) ? r.rows : [];
                    this.page.total = (r && r.total) ? r.total : 0;
                });
            },
            sortChange(key, sort) {
                this.sobj.sort = key;
                this.sobj.order = sort;
                this.refreshWords();
            },
            showEdit(row) {
                this.showWordEdit = true;
                this.fobj = row ? Object.assign({}, row) : {};
            },
            submitWord() {
                this.$refs.wordFormRef.validate((isValidate) => {
                    if (!isValidate) {
                        return;
                    }
                    this.fobj.table = this.tbname;
                    ajaxCallback("save", this.fobj, () => {
                        this.showWordEdit = false;
                        this.refreshWords();
                    });
                });
            },
            delWord(id) {
                ajaxCallback1("delete", { table: this.tbname, id: id }, () => {
                    this.refreshWords();
                });
            },
            resetCandidateQuery() {
                this.qobj = { statecn: "待处理", tablename: "" };
                this.refreshCandidates();
            },
            refreshCandidates() {
                this.loadingCandidates = true;
                ajaxCallback1("listSensitiveAICandidate", { limit: 200 }, (r) => {
                    this.loadingCandidates = false;
                    let rows = Array.isArray(r) ? r : [];
                    if (this.qobj.statecn) {
                        rows = rows.filter(x => (x.statecn || "") === this.qobj.statecn);
                    }
                    if (this.qobj.tablename) {
                        rows = rows.filter(x => (x.tablename || "").indexOf(this.qobj.tablename) !== -1);
                    }
                    this.candidateList = rows;
                });
            },
            refreshLogs() {
                this.loadingLogs = true;
                ajaxCallback1("listSensitiveHitLog", { limit: 200 }, (r) => {
                    this.loadingLogs = false;
                    this.logList = Array.isArray(r) ? r : [];
                });
            },
            openAdopt(row) {
                this.adoptForm = { id: row.id + "", word: "" };
                this.showAdopt = true;
            },
            adoptCandidate() {
                const p = { id: this.adoptForm.id };
                if (this.adoptForm.word) {
                    p.word = this.adoptForm.word;
                }
                ajaxCallback1("adoptSensitiveCandidate", p, (r) => {
                    if (r && r.ok) {
                        this.showAdopt = false;
                        this.refreshCandidates();
                        this.refreshWords();
                    } else {
                        alert((r && r.error) || "采纳失败");
                    }
                });
            },
            ignoreCandidate(row) {
                ajaxCallback1("ignoreSensitiveCandidate", { id: row.id }, (r) => {
                    if (r && r.ok) {
                        this.refreshCandidates();
                    } else {
                        alert((r && r.error) || "忽略失败");
                    }
                });
            }
        }
    };
    const app = Vue.createApp(App);
    app.use(LayuiVue);
    app.mount("#app");
</script>
</body>
</html>
